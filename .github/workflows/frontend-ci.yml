name: Frontend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'mentivy-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'mentivy-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-ci:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mentivy-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mentivy-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://mentivy.onrender.com/api/v1
