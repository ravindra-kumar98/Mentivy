name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'mentivy-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'mentivy-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-ci:
    name: Backend TypeScript Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mentivy-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mentivy-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Backend TypeScript
        run: npm run build
